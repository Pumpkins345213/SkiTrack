
events {}

http {
    upstream skitrack_backend {
        server web1:5000;
        server web2:5000;
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://skitrack_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/certs/skitrack.crt;
        ssl_certificate_key /etc/nginx/certs/skitrack.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://skitrack_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
